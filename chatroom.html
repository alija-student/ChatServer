<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatroom</title>

    <link rel="stylesheet" href="light.css">
    <link rel="stylesheet" href="dark.css" media="(prefers-color-scheme: dark)">
</head>

<body style="margin:0; padding:0; width:100%; height:100%; font-family:sans-serif; overflow:hidden;">

    <div id="app_container" style="display:flex; width:100%; height:100%; box-sizing:border-box;">

        <!-- USER LIST -->
        <div id="user_container" class="user-panel" style="width:20%; padding:1rem; overflow-y:auto; box-sizing:border-box;">

            <div id="user_list" class="user-list">
                <!-- JS USERS -->
            </div>
            
        </div>

        <!-- MESSAGE AREA -->
        <div id="message_container" style="width:80%; display:flex; flex-direction:column; height:100vh; border-left:1px solid; box-sizing:border-box; overflow:hidden;">

            <ul id="message_list" style="flex:1; list-style:none; padding:1rem; margin:0; overflow-y:auto;">
                <!-- JS MESSAGES -->
            </ul>

            <!-- INPUT -->
            <div id="message_adder" class="input-bar" style="display:flex; padding:1rem; box-sizing:border-box; flex-shrink:0;">

                <input id="message_input" class="message-input" type="text" placeholder="Input message..." style="flex:1; padding:0.5rem; font-size:1rem; border-radius:4px;">

                <button id="send_button" class="send-button" style="margin-left:0.5rem; padding:0.5rem 1rem; border:none; border-radius:4px; cursor:pointer;">Send</button>
            </div>

        </div>
    
    </div>

<script src="chatroom.js"></script>
</body>
</html>
