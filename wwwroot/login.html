<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="/css/light.css">
  <link rel="stylesheet" href="/css/dark.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/style.css">

</head>

<body class="auth-page">

  <div class="card">

    <img src="/img/logo.webp">

    <div style="margin-bottom:20px;"></div>

    <h1>Login</h1>

    <form>

      <label for="username">E-Mail oder Benutzername</label>
      <input id="username" type="text" required placeholder="username oder mail@beispiel.at">

      <label for="password">Passwort</label>
      <input id="password" type="password" required placeholder="••••••••">

      <button type="button" id="loginBtn" class="submit-btn">Log In</button>

    </form>

    <p id="errorMsg" class="error-msg"></p>

    <a href="forgot">Passwort vergessen?</a>

    <a href="register.html" style="margin-top:8px;">Noch kein Konto? Registrieren</a>

  </div>

  <!-- SCRIPTS -->
  <script src="/js/auth.js"></script>
  <script src="/js/login.js" defer></script>

</body>

</html>
