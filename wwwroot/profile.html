<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mein Profil</title>

<link rel="stylesheet" href="/css/light.css">
<link rel="stylesheet" href="/css/dark.css" media="(prefers-color-scheme: dark)">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter','Segoe UI',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{
    width:55px;
    height:55px;
    object-fit:contain;
}

.logo h1{
    font-size:24px;
    font-weight:700;
}

.nav-buttons{
    display:flex;
    gap:14px;
}

.nav-buttons button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    transition:0.25s;
}

.nav-buttons button:hover{
    transform:translateY(-2px);
}

/* =========================
   PROFILE LAYOUT
========================= */

.profile-container{
    width:100%;
    max-width:1450px;

    margin:auto;

    padding:50px;

    display:grid;
    grid-template-columns:350px 1fr;
    gap:40px;
}

/* =========================
   SIDEBAR
========================= */

.profile-sidebar{

    border-radius:28px;

    padding:35px;

    backdrop-filter:blur(12px);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.08);

    border:1px solid rgba(255,255,255,0.08);

    height:fit-content;
}

.avatar-box{

    width:220px;
    height:220px;

    margin:auto;
    margin-bottom:28px;

    border-radius:28px;

    overflow:hidden;

    border:5px solid #2563eb;

    position:relative;

    transition:0.35s;
}

.avatar-box:hover{
    transform:scale(1.03);
}

.avatar-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.upload-avatar{
    width:100%;
    margin-top:18px;
}

.upload-avatar button{
    width:100%;
    padding:14px;

    border:none;
    border-radius:12px;

    background:#2563eb;
    color:white;

    cursor:pointer;
    font-size:15px;

    transition:0.25s;
}

.upload-avatar button:hover{
    transform:translateY(-2px);
}

.profile-quickinfo{
    margin-top:35px;
}

.quick-item{
    margin-bottom:22px;
}

.quick-item span{
    display:block;
    font-size:13px;
    opacity:0.7;
    margin-bottom:6px;
}

.quick-item strong{
    font-size:16px;
}

/* =========================
   CONTENT
========================= */

.profile-content{

    border-radius:28px;

    padding:40px;

    backdrop-filter:blur(12px);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.08);

    border:1px solid rgba(255,255,255,0.08);
}

.profile-header{
    margin-bottom:40px;
}

.profile-header h2{
    font-size:42px;
    margin-bottom:10px;
}

.profile-header p{
    opacity:0.75;
    font-size:18px;
}

/* =========================
   FORM GRID
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    margin-bottom:10px;
    font-size:14px;
    font-weight:600;
}

.form-group input,
.form-group textarea{

    padding:16px;

    border-radius:14px;

    border:none;

    font-size:15px;

    outline:none;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(8px);
}

.form-group textarea{
    resize:none;
    min-height:120px;
}

.full-width{
    grid-column:1 / -1;
}

/* =========================
   INFO BOXES
========================= */

.info-boxes{
    margin-top:45px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.info-box{

    border-radius:22px;

    padding:28px;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(8px);

    transition:0.3s;
}

.info-box:hover{
    transform:translateY(-6px);
}

.info-box h3{
    margin-bottom:14px;
    font-size:20px;
}

.info-box p{
    line-height:1.6;
    opacity:0.82;
}

/* =========================
   BUTTONS
========================= */

.profile-actions{
    margin-top:45px;
    display:flex;
    gap:18px;
}

.profile-actions button{

    padding:16px 24px;

    border:none;
    border-radius:14px;

    cursor:pointer;

    font-size:15px;

    transition:0.25s;
}

.save-btn{
    background:#2563eb;
    color:white;
}

.logout-btn{
    background:#ef4444;
    color:white;
}

.profile-actions button:hover{
    transform:translateY(-3px);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    .profile-container{
        grid-template-columns:1fr;
    }

    .profile-sidebar{
        width:100%;
    }

}

@media(max-width:800px){

    .navbar{
        flex-direction:column;
        gap:20px;
        padding:25px;
    }

    .profile-container{
        padding:25px;
    }

    .profile-content{
        padding:30px 22px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .info-boxes{
        grid-template-columns:1fr;
    }

    .profile-header h2{
        font-size:34px;
    }

}

</style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">

        <img src="/img/logotr.webp">

        <h1>ChatSERVER</h1>

    </div>

    <div class="nav-buttons">

        <a href="index.html">
            <button>Home</button>
        </a>

        <a href="chatroom.html">
            <button>Chat</button>
        </a>

    </div>

</nav>

<!-- =========================
     PROFILE
========================= -->

<section class="profile-container">

    <!-- SIDEBAR -->

    <div class="profile-sidebar">

        <div class="avatar-box">

            <img src="/img/avatar.jpg">

        </div>

        <div class="upload-avatar">

            <button>
                Profilbild ändern
            </button>

        </div>

        <div class="profile-quickinfo">

            <div class="quick-item">
                <span>Benutzername</span>
                <strong id="profileUsername">@username</strong>
            </div>

            <div class="quick-item">
                <span>Status</span>
                <strong>Online</strong>
            </div>

        </div>

    </div>

    <!-- CONTENT -->

    <div class="profile-content">

        <div class="profile-header">

            <h2>Mein Profil</h2>

            <p>
                Verwalte deine persönlichen Einstellungen,
                Sessions, Kontakte und Sicherheitsoptionen.
            </p>

        </div>

        <!-- FORM -->

        <div class="form-grid">

            <div class="form-group">

                <label>Anzeigename</label>

                <input type="text" placeholder="My Name">

            </div>

            <div class="form-group">

                <label>Benutzername</label>

                <input type="text" placeholder="@username">

            </div>

            <div class="form-group">

                <label>E-Mail</label>

                <input type="email" placeholder="my@mail.com">

            </div>

            <div class="form-group">

                <label>Passwort ändern</label>

                <input type="password" placeholder="new Password">

            </div>

            <div class="form-group full-width">

                <label>Statusnachricht</label>

                <textarea placeholder="Was machst du gerade?"></textarea>

            </div>

        </div>

        <!-- INFO BOXES -->

        <div class="info-boxes">

    <!-- FRIENDSLIST -->

    <div class="info-box">

        <h3>Freundesliste</h3>

        <div class="list-container" id="friendsList">

            <div class="list-item">
                <div class="status online"></div>
                Freund 1
            </div>

            <div class="list-item">
                <div class="status offline"></div>
                Chef
            </div>

            <div class="list-item">
                <div class="status away"></div>
                Guru
            </div>

        </div>

    </div>

    <!-- GROUPS -->

    <div class="info-box">

        <h3>Gruppen</h3>

        <div class="list-container" id="groupList">

            <div class="list-item">
                # Work
            </div>

            <div class="list-item">
                # Friends
            </div>

            <div class="list-item">
                # Gaming
            </div>

        </div>

    </div>

    <!-- NOTIFICATIONS -->

    <div class="info-box">

        <h3>Benachrichtigungen</h3>

        <p>
            Passe Desktop-,
            Mobile- und Sound-
            Benachrichtigungen an.
        </p>

    </div>

</div>

        <!-- ACTIONS -->

        <div class="profile-actions">

            <button class="save-btn">
                Änderungen speichern
            </button>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </div>

</section>

<!-- SCRIPTS -->
<script src="/js/auth.js"></script>
<script>
    document.getElementById("profileUsername").innerText =
        "@" + (localStorage.getItem("username") || "?");
</script>

</body>
</html>
