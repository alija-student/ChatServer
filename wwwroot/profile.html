<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mein Profil</title>

<link rel="stylesheet" href="/css/light.css">
<link rel="stylesheet" href="/css/dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/css/style.css">

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">

        <img src="/img/logotr.webp">

        <h1>ChatSERVER</h1>

    </div>

    <div class="nav-buttons">

        <a href="index.html">
            <button>Home</button>
        </a>

        <a href="chatroom.html">
            <button>Chat</button>
        </a>

        <button onclick="logout()" style="background:#ef4444;">Logout</button>

    </div>

</nav>

<!-- =========================
     PROFILE
========================= -->

<section class="profile-container">

    <!-- SIDEBAR -->

    <div class="profile-sidebar">

        <div class="avatar-box">

            <img src="/img/avatar.jpg">

        </div>

        <div class="upload-avatar">

            <button>
                Profilbild ändern
            </button>

        </div>

        <div class="profile-quickinfo">

            <div class="quick-item">
                <span>Benutzername</span>
                <strong id="profileUsername">@username</strong>
            </div>

            <div class="quick-item">
                <span>Status</span>
                <strong>Online</strong>
            </div>

        </div>

    </div>

    <!-- CONTENT -->

    <div class="profile-content">

        <div class="profile-header">

            <h2>Mein Profil</h2>

            <p>
                Verwalte deine persönlichen Einstellungen,
                Sessions, Kontakte und Sicherheitsoptionen.
            </p>

        </div>

        <!-- FORM -->

        <div class="form-grid">

            <div class="form-group">

                <label>Anzeigename</label>

                <input type="text" placeholder="My Name">

            </div>

            <div class="form-group">

                <label>Benutzername</label>

                <input type="text" placeholder="@username">

            </div>

            <div class="form-group">

                <label>E-Mail</label>

                <input type="email" placeholder="my@mail.com">

            </div>

            <div class="form-group">

                <label>Passwort ändern</label>

                <input type="password" placeholder="new Password">

            </div>

            <div class="form-group full-width">

                <label>Statusnachricht</label>

                <textarea placeholder="Was machst du gerade?"></textarea>

            </div>

        </div>

        <!-- INFO BOXES -->

        <div class="info-boxes">

    <!-- FRIENDSLIST -->

    <div class="info-box">

        <h3>Freundesliste</h3>

        <div class="list-container" id="friendsList">

            <div class="list-item">
                <div class="status online"></div>
                Freund 1
            </div>

            <div class="list-item">
                <div class="status offline"></div>
                Chef
            </div>

            <div class="list-item">
                <div class="status away"></div>
                Guru
            </div>

        </div>

    </div>

    <!-- GROUPS -->

    <div class="info-box">

        <h3>Gruppen</h3>

        <div class="list-container" id="groupList">

            <div class="list-item">
                # Work
            </div>

            <div class="list-item">
                # Friends
            </div>

            <div class="list-item">
                # Gaming
            </div>

        </div>

    </div>

    <!-- NOTIFICATIONS -->

    <div class="info-box">

        <h3>Benachrichtigungen</h3>

        <p>
            Passe Desktop-,
            Mobile- und Sound-
            Benachrichtigungen an.
        </p>

    </div>

</div>

        <!-- ACTIONS -->

        <div class="profile-actions">

            <button class="save-btn">
                Änderungen speichern
            </button>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </div>

</section>

<!-- SCRIPTS -->
<script src="/js/auth.js"></script>
<script>
    document.getElementById("profileUsername").innerText =
        "@" + (localStorage.getItem("username") || "?");
</script>

</body>
</html>
