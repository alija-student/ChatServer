<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Register</title>

  <link rel="stylesheet" href="/css/light.css">
  <link rel="stylesheet" href="/css/dark.css" media="(prefers-color-scheme: dark)">

  <style>

    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      color: #1d1d1d;
      padding: 30px 40px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      text-align: center;
    }

    .card h1 { font-size: 26px; font-weight: 600; margin-bottom: 25px; }

    .card label {
      display: block;
      text-align: left;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #444;
    }

    .card input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d2d6dc;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
      box-sizing: border-box;
      background: #ffffff;
      color: #1d1d1d;
      outline: none;
      transition: border-color 0.2s;
    }

    .card input:focus { border-color: #2563eb; }

    .card .submit-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    .card .submit-btn:hover { background: #1d4ed8; }

    .card a {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #2563eb;
      text-decoration: none;
    }

    .error-msg {
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* ── dark mode ── */
    @media (prefers-color-scheme: dark) {
      .card {
        background: #1e293b;
        color: #f8fafc;
        border-color: rgba(255,255,255,0.08);
        box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      }
      .card h1 { color: #f8fafc; }
      .card label { color: #94a3b8; }
      .card a { color: #60a5fa; }
      .card input {
        background: #0f172a;
        border-color: #334155;
        color: #f8fafc;
      }
      .card input::placeholder { color: #475569; }
    }

  </style>

</head>

<body>

  <div class="card">

    <img src="/img/logo.webp">

    <h1>Register</h1>

    <form>

      <label for="name">Name</label>
      <input id="name" type="text" required placeholder="Max Mustermann">

      <label for="email">E-Mail</label>
      <input id="email" type="email" required placeholder="max@beispiel.at">

      <label for="username">Benutzername</label>
      <input id="username" type="text" required placeholder="maxmuster">

      <label for="password">Passwort</label>
      <input id="password" type="password" required placeholder="••••••••">

      <button type="button" id="registerBtn" class="submit-btn">Account erstellen</button>

    </form>

    <p id="errorMsg" class="error-msg"></p>

    <a href="login.html">Bereits registriert? Zum Login</a>

  </div>

  <!-- SCRIPTS -->
  <script src="/js/auth.js"></script>
  <script src="/js/register.js" defer></script>

</body>

</html>
