<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Register</title>

  <link rel="stylesheet" href="/css/light.css">
  <link rel="stylesheet" href="/css/dark.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/style.css">

</head>

<body class="auth-page">

  <div class="card">

    <img src="/img/logo.webp">

    <h1>Register</h1>

    <form>

      <label for="name">Name</label>
      <input id="name" type="text" required placeholder="Max Mustermann">

      <label for="email">E-Mail</label>
      <input id="email" type="email" required placeholder="max@beispiel.at">

      <label for="username">Benutzername</label>
      <input id="username" type="text" required placeholder="maxmuster">

      <label for="password">Passwort</label>
      <input id="password" type="password" required placeholder="••••••••">

      <button type="button" id="registerBtn" class="submit-btn">Account erstellen</button>

    </form>

    <p id="errorMsg" class="error-msg"></p>

    <a href="login.html">Bereits registriert? Zum Login</a>

  </div>

  <!-- SCRIPTS -->
  <script src="/js/auth.js"></script>
  <script src="/js/register.js" defer></script>

</body>

</html>
