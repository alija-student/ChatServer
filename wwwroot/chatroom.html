<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Room</title>

    <!-- BASE LAYOUT -->
    <link rel="stylesheet" href="/css/chatroom.css">

    <!-- THEME (will be swapped by JS) -->
    <link id="theme" rel="stylesheet" href="/css/light.css">

    <!-- AUTO THEME DETECTION -->
    <script>
        function applySystemTheme() {
            const prefersDark = window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;

            const themeLink = document.getElementById("theme");

            if (prefersDark) {
                themeLink.href = "/css/dark.css";
            } else {
                themeLink.href = "/css/light.css";
            }
        }

        applySystemTheme();
    </script>
</head>
<body>

    <!-- TOP BAR -->
    <div class="topbar">

       <div class="left">
            <img src="/img/logotr.png" class="logo">
            <div class="userinfo">
                Logged in as: <b id="currentUserTop"></b>
            </div>
        </div>

        <div class="buttons">
            <button onclick="window.open('index.html','_blank')">
                Home
            </button>

            <button onclick="window.open('profile.html','_blank')">
                Profile
            </button>

            <button onclick="logout()">
                Logout
            </button>

            <!-- theme toggle -->
            <button id="themeToggle" onclick="toggleTheme()">Dark</button>
        </div>

    </div>

    <!-- MAIN CONTENT -->
    <div class="container">

        <div class="layout">

            <!-- USER LIST -->
            <div class="userlist">
                <h3>Users</h3>
                <ul id="userList"></ul>
            </div>

            <!-- CHAT AREA -->
            <div class="chat-area">

                <div id="chatBox" class="chatbox"></div>

                <div class="message-bar">
                    <input id="messageInput" placeholder="Type message...">
                    <button onclick="sendMessage()">Send</button>
                </div>

            </div>

        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="/js/auth.js"></script>
    <script src="/js/chatroom.js" defer></script>

    <!-- small UI helpers -->
    <script id="uihelpers001">

    // show current user
    document.getElementById("currentUserTop").innerText =
    localStorage.getItem("username");

    function updateThemeButton() {
        const theme = document.getElementById("theme").href;

        document.getElementById("themeToggle").innerText =
            theme.includes("dark.css") ? "Light" : "Dark";
    }

    function setTheme(mode) {
        document.getElementById("theme").href = "/css/" + mode + ".css";
        updateThemeButton();
    }

    function toggleTheme() {
        const themeLink = document.getElementById("theme");

        if (themeLink.href.includes("dark.css")) {
            setTheme("light");
        } else {
            setTheme("dark");
        }
    }

    updateThemeButton();

</script>

</body>
</html>
