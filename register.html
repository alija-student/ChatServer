<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Register</title>

  <!-- Standard (Fallback = Light) -->
  <link rel="stylesheet" href="light.css">

  <!-- Dark Mode automatisch -->
  <link rel="stylesheet" href="dark.css" media="(prefers-color-scheme: dark)">

</head>

<body style="margin:0; font-family:'Inter','Segoe UI',Arial,sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; box-sizing:border-box;">

  <div style="width:100%; max-width:400px; background:#ffffff; padding:20px 40px; border:1px solid rgba(0,0,0,0.08); border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.06); text-align:center;">
    
    <img src="logo.webp">

    <h1 style="font-size:26px; color:#1d1d1d; font-weight:600; margin-bottom:25px;">
      Register
    </h1>

    <form>

      <!-- NAME -->

      <label for="name"
        style="display:block; text-align:left; margin-bottom:6px; font-size:14px; color:#444; font-weight:500;">
        Name
      </label>

      <input id="name"
        type="text"
        required
        style="width:100%; padding:12px; border:1px solid #d2d6dc; border-radius:6px; margin-bottom:16px; font-size:14px;">

      <!-- EMAIL -->

      <label for="email"
        style="display:block; text-align:left; margin-bottom:6px; font-size:14px; color:#444; font-weight:500;">
        E-Mail
      </label>

      <input id="email"
        type="email"
        required
        style="width:100%; padding:12px; border:1px solid #d2d6dc; border-radius:6px; margin-bottom:16px; font-size:14px;">

      <!-- USERNAME -->

      <label for="username"
        style="display:block; text-align:left; margin-bottom:6px; font-size:14px; color:#444; font-weight:500;">
        Benutzername
      </label>

      <input id="username"
        type="text"
        required
        style="width:100%; padding:12px; border:1px solid #d2d6dc; border-radius:6px; margin-bottom:16px; font-size:14px;">

      <!-- PASSWORD -->

      <label for="password"
        style="display:block; text-align:left; margin-bottom:6px; font-size:14px; color:#444; font-weight:500;">
        Passwort
      </label>

      <input id="password"
        type="password"
        required
        style="width:100%; padding:12px; border:1px solid #d2d6dc; border-radius:6px; margin-bottom:16px; font-size:14px;">

      <!-- BUTTON -->

      <button type="button"
        id="registerBtn"
        style="width:100%; padding:12px; background:#2563eb; border:none; border-radius:6px; color:#ffffff; font-size:15px; cursor:pointer; margin-top:8px;">

        Account erstellen

      </button>

    </form>

    <a href="login.html"
      style="display:block; text-align:center; margin-top:18px; font-size:14px; color:#2563eb; text-decoration:none;">

      Bereits registriert? Zum Login

    </a>

  </div>

  <script type="module" src="register.js"></script>

</body>

</html>
