<!DOCTYPE html>

<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Standard (Fallback = Light) -->
  <link rel="stylesheet" href="light.css">

  <!-- Dark Mode automatisch -->
  <link rel="stylesheet" href="dark.css" media="(prefers-color-scheme: dark)">

</head>

<body style="margin:0; font-family:'Inter','Segoe UI',Arial,sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; box-sizing:border-box;">

  <div style="width:100%; max-width:400px; background:#ffffff; padding:35px 40px; border:1px solid rgba(0,0,0,0.08); border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.06); text-align:center;">
    
    <img src="logo.webp">
    
    <div style="margin-bottom:20px;">
    
    </div>

    <h1 style="font-size:26px; color:#1d1d1d; font-weight:600; margin-bottom:25px;">Login</h1>

    <form>
      <label for="username" style="display:block; text-align:left; margin-bottom:6px; font-size:14px; color:#444; font-weight:500;">
        E-Mail oder Benutzername
      </label>
      <input id="username" type="text" required
        style="width:100%; padding:12px; border:1px solid #d2d6dc; border-radius:6px; margin-bottom:16px; font-size:14px;">

      <label for="password" style="display:block; text-align:left; margin-bottom:6px; font-size:14px; color:#444; font-weight:500;">
        Passwort
      </label>
      <input id="password" type="password" required
        style="width:100%; padding:12px; border:1px solid #d2d6dc; border-radius:6px; margin-bottom:16px; font-size:14px;">

      <button type="button" id="loginBtn"
        style="width:100%; padding:12px; background:#2563eb; border:none; border-radius:6px; color:#ffffff; font-size:15px; cursor:pointer; margin-top:8px;">
        Log In
      </button>
    </form>

    <a href="forgot"
      style="display:block; text-align:center; margin-top:18px; font-size:14px; color:#2563eb; text-decoration:none;">
      Passwort vergessen?
    </a>


  </div>

  <!-- SCRIPTS -->
<script src="auth.js"></script>
<script src="login.js" defer></script>

</body>

</html>
